services:
  - type: web
    name: TruckFixr-frontend
    runtime: static
    rootDir: .
    domains:
      - truckfixr.com
      - www.truckfixr.com
    autoDeploy: true
    buildCommand: npm install -g pnpm@10.15.1 && CI=true pnpm install --frozen-lockfile --force --reporter=append-only && pnpm build:client
    staticPublishPath: dist/public
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /access
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /access/*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /pilot
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /login
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /signup
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /auth/*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /profile
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /app
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /onboarding
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /manager
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /driver
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /diagnosis
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /inspection
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /inspection/*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /inspection-report/*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /defect/*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /truck/*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /pricing
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /privacy
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /terms
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /admin
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /admin/*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /404
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /manifest.json
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /sw.js
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /service-worker.js
        name: Cache-Control
        value: no-cache, must-revalidate
    routes:
      - type: rewrite
        source: /
        destination: /index.html
      - type: rewrite
        source: /access
        destination: /index.html
      - type: rewrite
        source: /access/*
        destination: /index.html
      - type: rewrite
        source: /pilot
        destination: /index.html
      - type: rewrite
        source: /login
        destination: /index.html
      - type: rewrite
        source: /signup
        destination: /index.html
      - type: rewrite
        source: /auth/*
        destination: /index.html
      - type: rewrite
        source: /profile
        destination: /index.html
      - type: rewrite
        source: /app
        destination: /index.html
      - type: rewrite
        source: /onboarding
        destination: /index.html
      - type: rewrite
        source: /manager
        destination: /index.html
      - type: rewrite
        source: /driver
        destination: /index.html
      - type: rewrite
        source: /diagnosis
        destination: /index.html
      - type: rewrite
        source: /inspection
        destination: /index.html
      - type: rewrite
        source: /inspection/*
        destination: /index.html
      - type: rewrite
        source: /inspection-report/*
        destination: /index.html
      - type: rewrite
        source: /defect/*
        destination: /index.html
      - type: rewrite
        source: /truck/*
        destination: /index.html
      - type: rewrite
        source: /pricing
        destination: /index.html
      - type: rewrite
        source: /privacy
        destination: /index.html
      - type: rewrite
        source: /terms
        destination: /index.html
      - type: rewrite
        source: /admin
        destination: /index.html
      - type: rewrite
        source: /admin/*
        destination: /index.html
      - type: rewrite
        source: /404
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.19.5
      - key: VITE_API_BASE_URL
        value: https://api.truckfixr.com
      - key: VITE_APP_ID
        value: truckfixr-render
      # Invite-only /try-one-case funnel (build-time). Route renders; the server
      # requires a valid GUEST_INVITE_CODES code, so it stays fail-closed.
      - key: VITE_ENABLE_TRY_ONE_CASE
        value: "true"
      # Public-launch gate (client mirror). One flag drives BOTH the homepage and
      # the funnel: "true" serves the V2 homepage AND presents the funnel publicly
      # (no invite); default "false" keeps the current landing + invite-only
      # funnel. Flip to "true" ONLY together with the api-side PUBLIC_LAUNCH_*
      # vars (the server independently hard-gates submissions), and only after
      # Ontario legal + 310T + commercial sign-off and a staffed reviewer.
      - key: VITE_PUBLIC_LAUNCH_APPROVED
        value: "false"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_OAUTH_PORTAL_URL
        sync: false
      - key: VITE_OAUTH_SERVER_URL
        sync: false
      - key: VITE_POSTHOG_API_KEY
        sync: false
      - key: VITE_POSTHOG_API_HOST
        sync: false
      - key: VITE_ANALYTICS_ENDPOINT
        sync: false
      - key: VITE_ANALYTICS_WEBSITE_ID
        sync: false
      - key: VITE_FRONTEND_FORGE_API_URL
        sync: false
      - key: VITE_FRONTEND_FORGE_API_KEY
        sync: false

  - type: web
    name: truckfixr-api
    runtime: node
    plan: free
    rootDir: .
    autoDeploy: true
    buildCommand: npm install -g pnpm@10.15.1 && CI=true pnpm install --frozen-lockfile --force --reporter=append-only && pnpm build
    startCommand: pnpm start:server
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20.19.5
      - key: NODE_ENV
        value: production
      - key: ALLOW_RUNTIME_SCHEMA_REPAIR
        value: "false"
      # Public guest "/try-one-case" workflow. Enabled, but gated by invite codes.
      - key: ENABLE_GUEST_WORKFLOW
        value: "true"
      # Invite-only gate (comma-separated codes). FAIL-CLOSED: until you set this
      # in the Render dashboard, NO guest case can be started even with the
      # workflow on. Set it to open the preview to invitees; clear it to close.
      - key: GUEST_INVITE_CODES
        sync: false
      # Public-launch gate (server, hard). The funnel opens to the public ONLY
      # when ALL of these hold, else it fails safe to invite-only:
      #   1. PUBLIC_LAUNCH_APPROVED=true  — the go decision.
      #   2. PUBLIC_LAUNCH_SIGNOFF set     — recorded legal/310T/commercial sign-off
      #      (a non-empty audit string, e.g. "legal+310T+commercial 2026-08").
      #   3. CASE_REVIEWER_EMAIL set       — a staffed reviewer (below).
      # Flip PUBLIC_LAUNCH_APPROVED + set PUBLIC_LAUNCH_SIGNOFF here AND set the
      # frontend VITE_PUBLIC_LAUNCH_APPROVED=true to go public.
      - key: PUBLIC_LAUNCH_APPROVED
        value: "false"
      - key: PUBLIC_LAUNCH_SIGNOFF
        sync: false
      # Staffed case reviewer (required for public launch; also receives review
      # alerts). Leave unset to keep the public-launch gate fail-safe closed.
      - key: CASE_REVIEWER_EMAIL
        sync: false
      - key: VITE_APP_ID
        value: truckfixr-render
      - key: APP_BASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OAUTH_SERVER_URL
        sync: false
      - key: NHTSA_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FLEET_MANAGER_EMAIL
        sync: false
      - key: OWNER_OPEN_ID
        sync: false
      - key: BUILT_IN_FORGE_API_URL
        sync: false
      - key: BUILT_IN_FORGE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-v4-flash
      - key: OPENROUTER_FALLBACK_MODEL
        value: google/gemini-2.5-flash
      - key: DEFAULT_CLASSIFICATION_MODEL
        value: deepseek/deepseek-v4-flash
      - key: DEFAULT_DIAGNOSIS_MODEL
        value: deepseek/deepseek-v4-flash
      - key: LOW_COST_CLARIFICATION_MODEL
        value: deepseek/deepseek-v4-flash
      - key: ADVANCED_DIAGNOSIS_MODEL
        value: openai/gpt-4.1-mini
      - key: SAFETY_CRITICAL_MODEL
        value: openai/gpt-4.1-mini
      - key: COMPLEX_FAULT_CODE_MODEL
        value: google/gemini-2.5-flash
      - key: JSON_REPAIR_MODEL
        value: openai/gpt-4.1-mini
      - key: FALLBACK_MODEL_1
        value: google/gemini-2.5-flash
      - key: FALLBACK_MODEL_2
        value: openai/gpt-4.1-mini
      - key: ADMIN_COMPARISON_MODEL
        value: openai/gpt-4.1-mini
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: DIAGNOSTIC_CONFIDENCE_THRESHOLD
        value: "80"
      - key: DIAGNOSTIC_MAX_CLARIFICATIONS
        value: "3"
      - key: DIAGNOSTIC_LLM_RETRY_COUNT
        value: "2"
      - key: DIAGNOSTIC_NEW_CAUSE_MIN_CONFIDENCE
        value: "62"
      - key: DIAGNOSTIC_TIMEOUT_MS
        value: "35000"
      - key: DIAGNOSTIC_INTAKE_MAX_TOKENS
        value: "320"
      - key: DIAGNOSTIC_REVIEW_MAX_TOKENS
        value: "380"
      - key: DIAGNOSIS_MAX_TOKENS
        value: "900"
      - key: SIMPLE_TADIS_MODE
        value: "false"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ENABLE_STRIPE_DIAGNOSTICS_ENDPOINT
        value: "false"
      - key: STRIPE_PRICE_OWNER_OPERATOR_MONTHLY
        sync: false
      - key: STRIPE_PRICE_OWNER_OPERATOR_ANNUAL
        sync: false
      - key: STRIPE_PRICE_SMALL_FLEET_MONTHLY
        sync: false
      - key: STRIPE_PRICE_SMALL_FLEET_ANNUAL
        sync: false
      - key: STRIPE_PRICE_FLEET_GROWTH_MONTHLY
        sync: false
      - key: STRIPE_PRICE_FLEET_GROWTH_ANNUAL
        sync: false
      - key: STRIPE_PRICE_FLEET_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_FLEET_PRO_ANNUAL
        sync: false
      - key: STRIPE_PRICE_FLEET_PILOT_30_DAY
        sync: false
      - key: STRIPE_PRICE_EXTRA_TRAILER_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PRO_ANNUAL
        sync: false
      - key: STRIPE_PRICE_FLEET_MONTHLY
        sync: false
      - key: ADMIN_EMAILS
        value: dkwesiga@truckfixr.com
      - key: SALES_NOTIFICATION_EMAIL
        sync: false
